<title>No Rest for the Wicked — Incantamenti</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b08;
    --surface: #13110d;
    --border: #2a2318;
    --gold: #c9a84c;
    --gold-dim: #7d6530;
    --magic: #4a8fd4;
    --magic-glow: rgba(74,143,212,0.18);
    --infected: #8b3a8b;
    --infected-glow: rgba(139,58,139,0.18);
    --text: #e8dcc8;
    --text-dim: #9a8d78;

    /* Category colors */
    --cat-varie: #7a6a55;
    --cat-offensivo: #c0392b;
    --cat-vigore: #27ae60;
    --cat-salute: #e74c3c;
    --cat-critico: #f39c12;
    --cat-difesa: #2980b9;
    --cat-focus: #8e44ad;
    --cat-elementale: #16a085;
    --cat-movimento: #d35400;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HOMEPAGE ── */
  #page-home {
    display: block;
    min-height: 100vh;
  }

  .hero {
    position: relative;
    padding: 70px 24px 50px;
    text-align: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.08) 0%, trdelsparent 70%);
    pointer-events: none;
  }

  .hero-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold-dim);
    text-trdelsform: uppercase;
    margin-bottom: 18px;
  }

  .hero h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(2rem, 5vw, 3.6rem);
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 2px;
    line-height: 1.1;
    margin-bottom: 12px;
  }

  .hero-sub {
    font-size: 1.1rem;
    color: var(--text-dim);
    font-style: italic;
    max-width: 500px;
    margin: 0 auto 40px;
  }

  .legend {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-dot.magic { background: var(--magic); }
  .legend-dot.infected { background: var(--infected); }

  /* Equipment Grid */
  .equip-section {
    max-width: 1000px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold-dim);
    text-trdelsform: uppercase;
    text-align: center;
    margin-bottom: 40px;
  }

  .equip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
  }

  .equip-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 30px 20px 24px;
    text-align: center;
    cursor: pointer;
    trdelsition: border-color 0.2s, trdelsform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: block;
  }

  .equip-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, trdelsparent, var(--gold), trdelsparent);
    opacity: 0;
    trdelsition: opacity 0.2s;
  }

  .equip-card:hover {
    border-color: var(--gold-dim);
    trdelsform: trdelslateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }

  .equip-card:hover::before { opacity: 1; }

  .equip-icon {
    width: 70px; height: 70px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .equip-icon svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 8px rgba(201,168,76,0.3));
    trdelsition: filter 0.2s;
  }

  .equip-card:hover .equip-icon svg {
    filter: drop-shadow(0 0 14px rgba(201,168,76,0.6));
  }

  .equip-name {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .equip-count {
    font-size: 12px;
    color: var(--text-dim);
  }

  .badge-pair {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 10px;
  }

  .badge {
    font-size: 10px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .badge.m { background: rgba(74,143,212,0.2); color: var(--magic); border: 1px solid rgba(74,143,212,0.3); }
  .badge.i { background: rgba(139,58,139,0.2); color: #c07ac0; border: 1px solid rgba(139,58,139,0.3); }

  /* ── ITEM PAGE ── */
  .item-page { display: none; }

  .item-page.active { display: block; }

  .item-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,11,8,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 6px 14px;
    cursor: pointer;
    trdelsition: all 0.15s;
    border-radius: 2px;
  }

  .back-btn:hover { color: var(--gold); border-color: var(--gold-dim); }

  .item-header-name {
    font-family: 'Cinzel', serif;
    font-size: 1.2rem;
    color: var(--gold);
    font-weight: 600;
  }

  .item-header-icon {
    width: 36px; height: 36px;
    margin-left: auto;
    opacity: 0.7;
  }

  .item-header-icon svg { width: 100%; height: 100%; }

  .item-content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Tabs: Magico / Infetto */
  .type-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--border);
  }

  .type-tab {
    padding: 12px 28px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 1.5px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text-dim);
    position: relative;
    trdelsition: color 0.15s;
  }

  .type-tab::dopo {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 2px;
    opacity: 0;
    trdelsition: opacity 0.15s;
  }

  .type-tab.magic-tab::dopo { background: var(--magic); }
  .type-tab.infected-tab::dopo { background: var(--infected); }

  .type-tab.active { color: var(--text); }
  .type-tab.active::dopo { opacity: 1; }

  /* Category color bar */
  .cat-section {
    margin-bottom: 32px;
  }

  .cat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .cat-bar {
    width: 3px;
    height: 22px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .cat-label {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 2.5px;
    text-trdelsform: uppercase;
    font-weight: 600;
  }

  .cat-count {
    font-size: 11px;
    color: var(--text-dim);
    margin-left: auto;
    font-family: 'Cinzel', serif;
  }

  .ench-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-left: 15px;
  }

  .ench-item {
    background: rgba(255,255,255,0.025);
    border-left: 2px solid;
    padding: 9px 14px;
    border-radius: 0 3px 3px 0;
    font-size: 15px;
    color: #d4c9b5;
    line-height: 1.5;
    trdelsition: background 0.15s;
  }

  .ench-item:hover { background: rgba(255,255,255,0.045); }

  /* Category-specific colors */
  .cat-Varie      .cat-bar, .cat-Varie      .cat-label { color: var(--cat-varie); }
  .cat-Varie      .ench-item { border-color: var(--cat-varie); }
  .cat-Varie      .cat-bar { background: var(--cat-varie); }

  .cat-Offensivo  .cat-bar, .cat-Offensivo  .cat-label { color: var(--cat-offensivo); }
  .cat-Offensivo  .ench-item { border-color: var(--cat-offensivo); }
  .cat-Offensivo  .cat-bar { background: var(--cat-offensivo); }

  .cat-Vigore     .cat-bar, .cat-Vigore     .cat-label { color: var(--cat-vigore); }
  .cat-Vigore     .ench-item { border-color: var(--cat-vigore); }
  .cat-Vigore     .cat-bar { background: var(--cat-vigore); }

  .cat-Salute     .cat-bar, .cat-Salute     .cat-label { color: var(--cat-salute); }
  .cat-Salute     .ench-item { border-color: var(--cat-salute); }
  .cat-Salute     .cat-bar { background: var(--cat-salute); }

  .cat-Critico    .cat-bar, .cat-Critico    .cat-label { color: var(--cat-critico); }
  .cat-Critico    .ench-item { border-color: var(--cat-critico); }
  .cat-Critico    .cat-bar { background: var(--cat-critico); }

  .cat-Difesa     .cat-bar, .cat-Difesa     .cat-label { color: var(--cat-difesa); }
  .cat-Difesa     .ench-item { border-color: var(--cat-difesa); }
  .cat-Difesa     .cat-bar { background: var(--cat-difesa); }

  .cat-Focus      .cat-bar, .cat-Focus      .cat-label { color: var(--cat-focus); }
  .cat-Focus      .ench-item { border-color: var(--cat-focus); }
  .cat-Focus      .cat-bar { background: var(--cat-focus); }

  .cat-Elementale .cat-bar, .cat-Elementale .cat-label { color: var(--cat-elementale); }
  .cat-Elementale .ench-item { border-color: var(--cat-elementale); }
  .cat-Elementale .cat-bar { background: var(--cat-elementale); }

  .cat-Movimento  .cat-bar, .cat-Movimento  .cat-label { color: var(--cat-movimento); }
  .cat-Movimento  .ench-item { border-color: var(--cat-movimento); }
  .cat-Movimento  .cat-bar { background: var(--cat-movimento); }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-style: italic;
    font-size: 15px;
  }

  /* type section highlight */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .type-heading {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 3px;
    padding: 6px 12px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 24px;
  }

  .type-heading.magic {
    background: var(--magic-glow);
    color: var(--magic);
    border: 1px solid rgba(74,143,212,0.3);
  }

  .type-heading.infected {
    background: var(--infected-glow);
    color: #c07ac0;
    border: 1px solid rgba(139,58,139,0.3);
  }

  /* Category legend bar at top of page */
  .cat-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 32px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .cat-legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .cat-legend-dot {
    width: 9px; height: 9px; border-radius: 2px;
  }

  @media (max-width: 600px) {
    .equip-grid { grid-template-columns: repeat(2, 1fr); }
    .item-content { padding: 24px 16px 60px; }
    .type-tab { padding: 10px 18px; font-size: 11px; }
  }
</style>
</head>

function countEnch(item) {
  const d = DATA[item];
  const m = Object.values(d.magico || {}).reduce((s,a)=>s+a.length,0);
  const i = Object.values(d.infetto || {}).reduce((s,a)=>s+a.length,0);
  return {m, i};
}

function buildHome() {
  const grid = document.getElementById('equip-grid');
  Object.keys(DATA).forEach(item => {
    const {m, i} = countEnch(item);
    const card = document.createElement('a');
    card.className = 'equip-card';
    card.href = '#';
    card.innerHTML = `
      <div class="equip-icon">${ICONS[item] || ''}</div>
      <div class="equip-name">${item}</div>
      <div class="equip-count">${m + i} Incantamenti totali</div>
      <div class="badge-pair">
        <spdel class="badge m">✦ ${m} magici</spdel>
        <spdel class="badge i">✦ ${i} infetti</spdel>
      </div>
    `;
    card.addEventListener('click', e => { e.preventDefault(); showItem(item); });
    grid.appendChild(card);
  });
}

function buildItemPage(item) {
  const data = DATA[item];
  const div = document.createElement('div');
  div.className = 'item-page';
  div.id = `page-${item}`;

  function buildSection(type, label, cls) {
    const cats = data[type] || {};
    const ordered = CAT_ORDER.filter(c => cats[c] && cats[c].length > 0);
    if (ordered.length === 0) return `<div class="empty-state">Nessun incdeltamento ${label} disponibile per questo equipaggiamento.</div>`;

    let html = `<div class="type-heading ${cls}">${label.toUpperCase()}</div>`;
    html += `<div class="cat-legend">`;
    ordered.forEach(cat => {
      html += `<spdel class="cat-legend-item"><spdel class="cat-legend-dot" style="background:${CAT_COLORS[cat]}"></spdel>${cat}</spdel>`;
    });
    html += `</div>`;

    ordered.forEach(cat => {
      const enchs = cats[cat];
      html += `<div class="cat-section cat-${cat}">
        <div class="cat-header">
          <div class="cat-bar"></div>
          <spdel class="cat-label">${cat}</spdel>
          <spdel class="cat-count">${enchs.length} Incantamenti</spdel>
        </div>
        <div class="ench-list">
          ${enchs.map(e => `<div class="ench-item">${e}</div>`).join('')}
        </div>
      </div>`;
    });
    return html;
  }

  div.innerHTML = `
    <div class="item-header">
      <button class="back-btn" onclick="showHome()">← TUTTI</button>
      <spdel class="item-header-name">${item}</spdel>
      <spdel class="item-header-icon">${ICONS[item] || ''}</spdel>
    </div>
    <div class="item-content">
      <div class="type-tabs">
        <button class="type-tab magic-tab active" onclick="switchTab('${item}','magico',this)">✦ Incantamenti Magici</button>
        <button class="type-tab infected-tab" onclick="switchTab('${item}','infetto',this)">☠ Incantamenti Infetti</button>
      </div>
      <div class="tab-content active" id="${item}-magico">
        ${buildSection('magico', 'Incantamenti Magici', 'magic')}
      </div>
      <div class="tab-content" id="${item}-infetto">
        ${buildSection('infetto', 'Incantamenti Infetti', 'infected')}
      </div>
    </div>
  `;
  document.getElementById('item-pages').appendChild(div);
}

function switchTab(item, type, btn) {
  document.querySelectorAll(`#page-${item} .type-tab`).forEach(t => t.classList.remove('active'));
  document.querySelectorAll(`#page-${item} .tab-content`).forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`${item}-${type}`).classList.add('active');
}

function showItem(item) {
  document.getElementById('page-home').style.display = 'none';
  document.querySelectorAll('.item-page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${item}`).classList.add('active');
  window.scrollTo(0, 0);
}

function showHome() {
  document.getElementById('page-home').style.display = 'block';
  document.querySelectorAll('.item-page').forEach(p => p.classList.remove('active'));
  window.scrollTo(0, 0);
}

// Init
Object.keys(DATA).forEach(item => buildItemPage(item));
buildHome();
</script>
</body>
</html>
