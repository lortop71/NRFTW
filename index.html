<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Rest for the Wicked — Incantamenti</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b08;
    --surface: #13110d;
    --border: #2a2318;
    --gold: #c9a84c;
    --gold-dim: #7d6530;
    --magic: #4a8fd4;
    --magic-glow: rgba(74,143,212,0.18);
    --infected: #8b3a8b;
    --infected-glow: rgba(139,58,139,0.18);
    --text: #f0e6d2;
    --text-dim: #ab9c84;
    --ench-bg: rgba(255,255,255,0.03);
    --ench-bg-hover: rgba(255,255,255,0.055);
    --shadow: rgba(0,0,0,0.4);
    --shadow-strong: rgba(0,0,0,0.6);

    --cat-varie: #9a8a70;
    --cat-offensivo: #d9483a;
    --cat-vigore: #2ecc71;
    --cat-salute: #ff5c4d;
    --cat-critico: #f5a623;
    --cat-difesa: #3498db;
    --cat-focus: #a55ad1;
    --cat-elementale: #1abc9c;
    --cat-movimento: #e67e22;
  }

  [data-theme="light"] {
    --bg: #f3ede0;
    --surface: #ffffff;
    --border: #d9cdb0;
    --gold: #8a6a1f;
    --gold-dim: #b89a4e;
    --magic: #2766a8;
    --magic-glow: rgba(39,102,168,0.12);
    --infected: #7a2f7a;
    --infected-glow: rgba(122,47,122,0.12);
    --text: #2c2417;
    --text-dim: #6b5d45;
    --ench-bg: rgba(0,0,0,0.035);
    --ench-bg-hover: rgba(0,0,0,0.06);
    --shadow: rgba(140,120,80,0.18);
    --shadow-strong: rgba(140,120,80,0.28);

    --cat-varie: #7a6a50;
    --cat-offensivo: #b8311f;
    --cat-vigore: #1d8a4a;
    --cat-salute: #c93a2c;
    --cat-critico: #b8770f;
    --cat-difesa: #1f6fa8;
    --cat-focus: #7e3aa3;
    --cat-elementale: #0f8a73;
    --cat-movimento: #b85f10;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 19px;
    line-height: 1.65;
    min-height: 100vh;
    transition: background 0.25s, color 0.25s;
  }

  /* Theme toggle */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 60px;
    z-index: 200;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    background: var(--surface);
    color: var(--gold);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px var(--shadow);
    transition: transform 0.2s, border-color 0.2s, background 0.25s, color 0.25s;
  }

  .theme-toggle:hover { transform: scale(1.08); border-color: var(--gold); }

  /* ── HOMEPAGE ── */
  #page-home { min-height: 100vh; }

  .hero {
    position: relative;
    padding: 70px 24px 50px;
    text-align: center;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .hero h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 2px;
    line-height: 1.1;
    margin-bottom: 14px;
  }

  .hero-sub {
    font-size: 1.25rem;
    color: var(--text-dim);
    font-style: italic;
    max-width: 540px;
    margin: 0 auto 40px;
  }

  .legend {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .legend-dot.magic { background: var(--magic); }
  .legend-dot.infected { background: var(--infected); }

  .equip-section { max-width: 1040px; margin: 0 auto; padding: 60px 24px 80px; }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--gold-dim);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 40px;
  }

  .equip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 22px;
  }

  .equip-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 26px 20px 22px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: block;
  }

  .equip-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .equip-card:hover { border-color: var(--gold-dim); transform: translateY(-3px); box-shadow: 0 12px 40px var(--shadow); }
  .equip-card:hover::before { opacity: 1; }

  .equip-icon {
    width: 92px; height: 92px;
    margin: 0 auto 14px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--gold-dim);
    box-shadow: 0 0 0 3px var(--shadow), 0 8px 20px var(--shadow);
    transition: box-shadow 0.2s, border-color 0.2s;
  }

  .equip-card:hover .equip-icon { border-color: var(--gold); box-shadow: 0 0 0 3px var(--magic-glow), 0 8px 24px var(--shadow-strong); }

  .equip-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .equip-name {
    font-family: 'Cinzel', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .equip-count { font-size: 14px; color: var(--text-dim); }

  .badge-pair { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

  .badge {
    font-size: 12px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .badge.m { background: rgba(74,143,212,0.2); color: var(--magic); border: 1px solid rgba(74,143,212,0.3); }
  .badge.i { background: rgba(139,58,139,0.2); color: #d090d0; border: 1px solid rgba(139,58,139,0.3); }

  .loading-msg { text-align: center; padding: 60px 20px; color: var(--text-dim); font-style: italic; font-size: 18px; }

  /* ── ITEM PAGE ── */
  .item-page { display: none; }
  .item-page.active { display: block; }

  .item-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    opacity: 0.97;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 3px;
  }

  .back-btn:hover { color: var(--gold); border-color: var(--gold-dim); }

  .item-header-name {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: var(--gold);
    font-weight: 600;
  }

  .item-header-icon {
    width: 44px; height: 44px;
    margin-left: auto;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--gold-dim);
  }

  .item-header-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .item-content { max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px; }

  .type-tabs { display: flex; gap: 4px; margin-bottom: 36px; border-bottom: 1px solid var(--border); }

  .type-tab {
    padding: 14px 30px;
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 1.5px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text-dim);
    position: relative;
    transition: color 0.15s;
  }

  .type-tab::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; opacity: 0; transition: opacity 0.15s; }
  .type-tab.magic-tab::after { background: var(--magic); }
  .type-tab.infected-tab::after { background: var(--infected); }
  .type-tab.active { color: var(--text); }
  .type-tab.active::after { opacity: 1; }

  .cat-section { margin-bottom: 34px; }

  .cat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

  .cat-bar { width: 4px; height: 24px; border-radius: 2px; flex-shrink: 0; }

  .cat-label {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .cat-count { font-size: 13px; color: var(--text-dim); margin-left: auto; font-family: 'Cinzel', serif; }

  .ench-list { display: flex; flex-direction: column; gap: 8px; padding-left: 16px; }

  .ench-item {
    background: var(--ench-bg);
    border-left: 3px solid;
    padding: 12px 16px;
    border-radius: 0 4px 4px 0;
    font-size: 17px;
    color: var(--text);
    line-height: 1.55;
    transition: background 0.15s;
  }

  .ench-item:hover { background: var(--ench-bg-hover); }

  .cat-Varie      .cat-bar, .cat-Varie      .cat-label { color: var(--cat-varie); }
  .cat-Varie      .ench-item { border-color: var(--cat-varie); }
  .cat-Varie      .cat-bar { background: var(--cat-varie); }

  .cat-Offensivo  .cat-bar, .cat-Offensivo  .cat-label { color: var(--cat-offensivo); }
  .cat-Offensivo  .ench-item { border-color: var(--cat-offensivo); }
  .cat-Offensivo  .cat-bar { background: var(--cat-offensivo); }

  .cat-Vigore     .cat-bar, .cat-Vigore     .cat-label { color: var(--cat-vigore); }
  .cat-Vigore     .ench-item { border-color: var(--cat-vigore); }
  .cat-Vigore     .cat-bar { background: var(--cat-vigore); }

  .cat-Salute     .cat-bar, .cat-Salute     .cat-label { color: var(--cat-salute); }
  .cat-Salute     .ench-item { border-color: var(--cat-salute); }
  .cat-Salute     .cat-bar { background: var(--cat-salute); }

  .cat-Critico    .cat-bar, .cat-Critico    .cat-label { color: var(--cat-critico); }
  .cat-Critico    .ench-item { border-color: var(--cat-critico); }
  .cat-Critico    .cat-bar { background: var(--cat-critico); }

  .cat-Difesa     .cat-bar, .cat-Difesa     .cat-label { color: var(--cat-difesa); }
  .cat-Difesa     .ench-item { border-color: var(--cat-difesa); }
  .cat-Difesa     .cat-bar { background: var(--cat-difesa); }

  .cat-Focus      .cat-bar, .cat-Focus      .cat-label { color: var(--cat-focus); }
  .cat-Focus      .ench-item { border-color: var(--cat-focus); }
  .cat-Focus      .cat-bar { background: var(--cat-focus); }

  .cat-Elementale .cat-bar, .cat-Elementale .cat-label { color: var(--cat-elementale); }
  .cat-Elementale .ench-item { border-color: var(--cat-elementale); }
  .cat-Elementale .cat-bar { background: var(--cat-elementale); }

  .cat-Movimento  .cat-bar, .cat-Movimento  .cat-label { color: var(--cat-movimento); }
  .cat-Movimento  .ench-item { border-color: var(--cat-movimento); }
  .cat-Movimento  .cat-bar { background: var(--cat-movimento); }

  .empty-state { text-align: center; padding: 40px; color: var(--text-dim); font-style: italic; font-size: 17px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .type-heading {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 7px 14px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 24px;
  }

  .type-heading.magic { background: var(--magic-glow); color: var(--magic); border: 1px solid rgba(74,143,212,0.3); }
  .type-heading.infected { background: var(--infected-glow); color: #d090d0; border: 1px solid rgba(139,58,139,0.3); }

  .cat-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 32px;
    padding: 18px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
  }

  .cat-legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .cat-legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  @media (max-width: 600px) {
    body { font-size: 18px; }
    .equip-grid { grid-template-columns: repeat(2, 1fr); }
    .item-content { padding: 24px 16px 60px; }
    .type-tab { padding: 12px 20px; font-size: 13px; }
    .equip-icon { width: 78px; height: 78px; }
    .theme-toggle { width: 40px; height: 40px; font-size: 17px; top: 10px; right: 10px; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Cambia tema" aria-label="Cambia tema chiaro/scuro">🌙</button>

<div id="page-home">
  <div class="hero">
    <div class="hero-eyebrow">No Rest for the Wicked</div>
    <h1>Incantamenti</h1>
    <p class="hero-sub">Guida completa agli incantamenti magici e infetti per ogni tipo di equipaggiamento</p>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot magic"></span> Incantamenti Magici</span>
      <span class="legend-item"><span class="legend-dot infected"></span> Incantamenti Infetti</span>
    </div>
  </div>

  <div class="equip-section">
    <div class="section-title">Seleziona equipaggiamento</div>
    <div class="equip-grid" id="equip-grid">
      <div class="loading-msg">Caricamento incantamenti…</div>
    </div>
  </div>
</div>

<div id="item-pages"></div>

<script>
const ICON_FILES = {
  Arma: 'icons/arma.png',
  Scudo: 'icons/scudo.png',
  Arco: 'icons/arco.png',
  Elmo: 'icons/elmo.png',
  Armatura: 'icons/armatura.png',
  Pantaloni: 'icons/pantaloni.png',
  Guanti: 'icons/guanti.png'
};

const CAT_COLORS = {
  Varie: '#9a8a70', Offensivo: '#d9483a', Vigore: '#2ecc71',
  Salute: '#ff5c4d', Critico: '#f5a623', Difesa: '#3498db',
  Focus: '#a55ad1', Elementale: '#1abc9c', Movimento: '#e67e22'
};

const CAT_ORDER = ['Varie','Offensivo','Vigore','Salute','Critico','Difesa','Focus','Elementale','Movimento'];

let DATA = {};

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  btn.textContent = theme === 'light' ? '☀️' : '🌙';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('nrftw-theme', next); } catch(e) {}
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('nrftw-theme'); } catch(e) {}
  if (!saved) {
    saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  applyTheme(saved);
})();

function countEnch(item) {
  const d = DATA[item];
  const m = Object.values(d.magico || {}).reduce((s,a)=>s+a.length,0);
  const i = Object.values(d.infetto || {}).reduce((s,a)=>s+a.length,0);
  return {m, i};
}

function buildHome() {
  const grid = document.getElementById('equip-grid');
  grid.innerHTML = '';
  Object.keys(DATA).forEach(item => {
    const {m, i} = countEnch(item);
    const card = document.createElement('a');
    card.className = 'equip-card';
    card.href = '#';
    const iconSrc = ICON_FILES[item] || '';
    card.innerHTML = `
      <div class="equip-icon"><img src="${iconSrc}" alt="${item}"></div>
      <div class="equip-name">${item}</div>
      <div class="equip-count">${m + i} incantamenti totali</div>
      <div class="badge-pair">
        <span class="badge m">✦ ${m} magici</span>
        <span class="badge i">✦ ${i} infetti</span>
      </div>
    `;
    card.addEventListener('click', e => { e.preventDefault(); showItem(item); });
    grid.appendChild(card);
  });
}

function buildItemPage(item) {
  const data = DATA[item];
  const div = document.createElement('div');
  div.className = 'item-page';
  div.id = `page-${item}`;
  const iconSrc = ICON_FILES[item] || '';

  function buildSection(type, label, cls) {
    const cats = data[type] || {};
    const ordered = CAT_ORDER.filter(c => cats[c] && cats[c].length > 0);
    if (ordered.length === 0) return `<div class="empty-state">Nessun incantamento ${label.toLowerCase()} disponibile per questo equipaggiamento.</div>`;

    let html = `<div class="type-heading ${cls}">${label.toUpperCase()}</div>`;
    html += `<div class="cat-legend">`;
    ordered.forEach(cat => {
      html += `<span class="cat-legend-item"><span class="cat-legend-dot" style="background:${CAT_COLORS[cat]}"></span>${cat}</span>`;
    });
    html += `</div>`;

    ordered.forEach(cat => {
      const enchs = cats[cat];
      html += `<div class="cat-section cat-${cat}">
        <div class="cat-header">
          <div class="cat-bar"></div>
          <span class="cat-label">${cat}</span>
          <span class="cat-count">${enchs.length} incantamenti</span>
        </div>
        <div class="ench-list">
          ${enchs.map(e => `<div class="ench-item">${e}</div>`).join('')}
        </div>
      </div>`;
    });
    return html;
  }

  div.innerHTML = `
    <div class="item-header">
      <button class="back-btn" onclick="showHome()">← TUTTI</button>
      <span class="item-header-name">${item}</span>
      <span class="item-header-icon"><img src="${iconSrc}" alt="${item}"></span>
    </div>
    <div class="item-content">
      <div class="type-tabs">
        <button class="type-tab magic-tab active" onclick="switchTab('${item}','magico',this)">✦ Incantamenti Magici</button>
        <button class="type-tab infected-tab" onclick="switchTab('${item}','infetto',this)">☠ Incantamenti Infetti</button>
      </div>
      <div class="tab-content active" id="${item}-magico">
        ${buildSection('magico', 'Incantamenti Magici', 'magic')}
      </div>
      <div class="tab-content" id="${item}-infetto">
        ${buildSection('infetto', 'Incantamenti Infetti', 'infected')}
      </div>
    </div>
  `;
  document.getElementById('item-pages').appendChild(div);
}

function switchTab(item, type, btn) {
  document.querySelectorAll(`#page-${item} .type-tab`).forEach(t => t.classList.remove('active'));
  document.querySelectorAll(`#page-${item} .tab-content`).forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`${item}-${type}`).classList.add('active');
}

function showItem(item) {
  document.getElementById('page-home').style.display = 'none';
  document.querySelectorAll('.item-page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${item}`).classList.add('active');
  window.scrollTo(0, 0);
}

function showHome() {
  document.getElementById('page-home').style.display = 'block';
  document.querySelectorAll('.item-page').forEach(p => p.classList.remove('active'));
  window.scrollTo(0, 0);
}

fetch('enchantments.json')
  .then(r => r.json())
  .then(json => {
    DATA = json;
    Object.keys(DATA).forEach(item => buildItemPage(item));
    buildHome();
  })
  .catch(err => {
    document.getElementById('equip-grid').innerHTML = '<div class="loading-msg">Errore nel caricamento dei dati: ' + err.message + '</div>';
  });
</script>
</body>
</html>
